name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify XPI archive
        run: unzip -t "dist/zotero-codex-sidebar-$(node -p "require('./package.json').version").xpi"
      - name: Upload CI build
        uses: actions/upload-artifact@v4
        with:
          name: zotero-codex-sidebar-${{ github.sha }}
          path: dist/*.xpi
          if-no-files-found: error
          retention-days: 14
