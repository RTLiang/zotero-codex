name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare next release version
        id: version
        shell: bash
        run: |
          version="$(node scripts/prepare-auto-release.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Prepare release artifact and update manifest
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          xpi="dist/zotero-codex-sidebar-${VERSION}.xpi"
          test -f "$xpi"
          unzip -t "$xpi"
          node scripts/prepare-release.mjs \
            "$VERSION" \
            "$GITHUB_REPOSITORY" \
            "$TAG" \
            "$xpi"

          cp updates.json "$RUNNER_TEMP/updates.json"
          cp package.json "$RUNNER_TEMP/package.json"
          cp manifest.json "$RUNNER_TEMP/manifest.json"
          git restore -- updates.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json
          git commit -m "Prepare release ${TAG}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "xpi=$xpi" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          XPI: ${{ steps.artifact.outputs.xpi }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" "$XPI" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zotero Codex Sidebar ${VERSION}" \
            --generate-notes \
            --latest
      - name: Publish Zotero auto-update manifest
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/updates.json" updates.json
          cp "$RUNNER_TEMP/package.json" package.json
          cp "$RUNNER_TEMP/manifest.json" manifest.json

          if git diff --quiet -- updates.json package.json manifest.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json package.json manifest.json
          git commit -m "Update Zotero auto-update manifest for ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
