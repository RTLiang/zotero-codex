name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Prepare release artifact and update manifest
        id: artifact
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./manifest.json').version")"
          test "$version" = "$package_version"
          test "$version" = "$manifest_version"

          xpi="dist/zotero-codex-sidebar-${version}.xpi"
          test -f "$xpi"
          unzip -t "$xpi"
          node scripts/prepare-release.mjs \
            "$version" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REF_NAME" \
            "$xpi"

          cp updates.json "$RUNNER_TEMP/updates.json"
          echo "xpi=$xpi" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          XPI: ${{ steps.artifact.outputs.xpi }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$XPI" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Zotero Codex Sidebar ${GITHUB_REF_NAME#v}" \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" "$XPI" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Zotero Codex Sidebar ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --latest
          fi
      - name: Publish Zotero auto-update manifest
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/updates.json" updates.json

          if git diff --quiet -- updates.json; then
            exit 0
          fi

          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git add updates.json
          git commit -m "Update Zotero auto-update manifest for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
